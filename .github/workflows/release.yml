name: Release Ignite Master

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            suffix: ""
          - target: aarch64-unknown-linux-gnu
            suffix: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation deps (ARM64)
        if: contains(matrix.target, 'aarch64')
        run: |
          sudo dpkg --add-architecture arm64
          sudo apt-get update
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu \
            libc6-dev-arm64-cross \
            libssl-dev:arm64 \
            pkg-config-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
          echo "PKG_CONFIG_ALLOW_CROSS=1" >> $GITHUB_ENV
          echo "PKG_CONFIG_PATH=/usr/lib/aarch64-linux-gnu/pkgconfig" >> $GITHUB_ENV
          echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
        working-directory: master

      - name: Prepare artifacts
        run: |
          mkdir -p artifacts
          cp master/target/${{ matrix.target }}/release/ignite-master${{ matrix.suffix }} artifacts/
          cp ignite-config.example.toml artifacts/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ignite-master-${{ matrix.target }}
          path: artifacts/*

  create-release:
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Create release archives
        run: |
          mkdir dist
          for dir in release-artifacts/*/; do
            name=$(basename "$dir")
            (cd "$dir" && tar czf "../../dist/ignite-master-${name}.tar.gz" .)
          done

          git archive --format=tar.gz --prefix=ignite-master/ -o dist/ignite-master-source.tar.gz HEAD

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
