name: Release Ignite Master

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build x86_64-unknown-linux-gnu
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release
        working-directory: master

      - name: Prepare artifacts
        run: |
          mkdir -p artifacts
          cp master/target/release/ignite-master artifacts/
          cp ignite-config.example.toml artifacts/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ignite-master-x86_64-unknown-linux-gnu
          path: artifacts/*

  create-release:
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Create release archives
        run: |
          mkdir dist
          for dir in release-artifacts/*/; do
            name=$(basename "$dir")
            (cd "$dir" && tar czf "../../dist/ignite-master-${name}.tar.gz" .)
          done

          git archive --format=tar.gz --prefix=ignite-master/ -o dist/ignite-master-source.tar.gz HEAD

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
